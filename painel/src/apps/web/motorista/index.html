<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>App</title>
    <script>
      // Pré-pintura: se já há imagem de abertura guardada, ela cobre a tela antes mesmo do app carregar (sem piscar branco).
      try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("abertura-motorista-") === 0) { var g = JSON.parse(localStorage.getItem(k)); var d = document.documentElement.style; if (g.img) { d.background = "#000 url(" + g.img + ") center/cover no-repeat"; } else if (g.cor) { d.background = g.cor; } break; } } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
