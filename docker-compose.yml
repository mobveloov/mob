# Sobe o painel no Docker:  docker compose up -d --build   →  http://localhost:8787 (ou a porta de PAINEL_PORTA)
# As chaves (opcionais) ficam no arquivo painel/.env (copie de painel/.env.example). Nada de chave aqui.
#
# Endereço público fixo (ex.: up.veloov.com) pelo túnel da Cloudflare, sem abrir porta no roteador:
#   1. Cloudflare > Zero Trust > Networks > Tunnels > Create tunnel (tipo Cloudflared). Copie o TOKEN.
#   2. No túnel, em "Public hostname": up.veloov.com  ->  http://painel:8787
#   3. Ponha o token no arquivo .env da raiz (fora do Git):  CLOUDFLARE_TUNNEL_TOKEN=...
#   4. docker compose --profile publico up -d --build
# (O Cloudflare Pages não serve: ele só hospeda arquivos estáticos e o painel precisa deste servidor.)
services:
  painel:
    build: .
    container_name: mob-painel
    ports:
      - "${PAINEL_PORTA:-8787}:8787"
    env_file:
      - path: painel/.env
        required: false
    environment:
      DADOS_DIR: /dados
      # Banco do painel (SQLite, roda junto, sem servidor separado): conversas do bot e fila do CRM.
      BANCO_ARQUIVO: /banco/painel.db
      # Endereços do CNEFE (opcional): pasta com os arquivos <UF>.tsv.gz.
      CNEFE_DIR: /cnefe
      # Atrás do túnel: o painel vê o IP real de quem acessa (limites de tentativa por pessoa).
      CONFIAR_PROXY: "${CONFIAR_PROXY:-1}"
    volumes:
      - painel-dados:/dados
      - painel-banco:/banco
      - ${CNEFE_PASTA:-./sem-cnefe}:/cnefe:ro
    restart: unless-stopped

  # Túnel fixo da Cloudflare (só com --profile publico). O token vem do .env da raiz (nunca no Git).
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-faltando-o-token-no-env}
    depends_on:
      - painel
    restart: unless-stopped
    profiles: ["publico"]

volumes:
  painel-dados:
  painel-banco:
